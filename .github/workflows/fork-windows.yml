# Fork only (Sheepdog-01/chupathingyce): never part of a pull request.
#
# Builds just the Windows game from any branch, for testing on a Surface
# without waiting on (or paying for) the other platforms. It is the Windows
# job of build.yml cut down to the release build; keep it in step when that
# job's toolchain steps change.
#
# Run it from the Actions tab: Fork Windows build > Run workflow, and give the
# branch to build. (The button lists only workflows on main, which is why this
# file lives here and the branch is an input.)
name: Fork Windows build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: The branch, tag or commit to build
        type: string
        required: true
        default: touch-menus-desktop
      debug:
        description: Also make the debug build (stops at the first failed check)
        type: boolean
        default: false

run-name: Windows build of ${{ inputs.ref }}

permissions:
  contents: read

env:
  CI_COMPILER_LAUNCHER: ccache
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_MAXSIZE: 1G

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Install the toolchain
        shell: pwsh
        run: |
          Invoke-WebRequest -OutFile ninja.zip https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-win.zip
          Invoke-WebRequest -OutFile ccache.zip https://github.com/ccache/ccache/releases/download/v4.10.2/ccache-4.10.2-windows-x86_64.zip
          if ((Get-FileHash ninja.zip -Algorithm SHA256).Hash -ne "F550FEC705B6D6FF58F2DB3C374C2277A37691678D6ABA463ADCBB129108467A") { throw "ninja.zip: unexpected SHA-256" }
          if ((Get-FileHash ccache.zip -Algorithm SHA256).Hash -ne "6252F081876A9A9F700FAE13A5AEC5D0D486B28261D7F1F72AC11C7AD9DF4DA9") { throw "ccache.zip: unexpected SHA-256" }
          Expand-Archive ninja.zip -DestinationPath "$env:RUNNER_TEMP\tools"
          Expand-Archive ccache.zip -DestinationPath $env:RUNNER_TEMP
          Copy-Item "$env:RUNNER_TEMP\ccache-4.10.2-windows-x86_64\ccache.exe" "$env:RUNNER_TEMP\tools"
          Remove-Item ninja.zip, ccache.zip
          "$env:RUNNER_TEMP\tools" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # (each run saves its compile cache, so the next run of a branch
      # recompiles only what changed)
      - uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: fork-ccache-windows-${{ github.run_id }}
          restore-keys: fork-ccache-windows-

      - uses: actions/cache@v4
        with:
          path: build/downloads
          key: ffmpeg-source-${{ hashFiles('tools/ffmpeg_build.py') }}

      - uses: actions/cache@v4
        with:
          path: build/windows/third_party
          key: windows-third-party-${{ hashFiles('tools/windows_build.py') }}

      - name: MSYS2 make
        run: /c/msys64/usr/bin/pacman.exe -S --noconfirm --needed make diffutils

      - uses: actions/cache@v4
        with:
          path: build/windows/ffmpeg
          key: windows-ffmpeg-${{ hashFiles('tools/ffmpeg_build.py') }}

      - name: Debug
        if: ${{ inputs.debug }}
        run: python tools/ci_build.py windows debug

      - name: Release
        run: python tools/ci_build.py windows release

      - name: Compile cache
        run: ccache --show-stats

      - uses: actions/upload-artifact@v4
        with:
          name: chupathingyce-windows-release
          path: dist/chupathingyce-windows-release
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.debug }}
        with:
          name: chupathingyce-windows-debug
          path: dist/chupathingyce-windows-debug
          retention-days: 7

      - uses: actions/cache/save@v4
        if: ${{ success() }}
        with:
          path: .ccache
          key: fork-ccache-windows-${{ github.run_id }}
